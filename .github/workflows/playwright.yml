name: Playwright Checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Print tool versions
      run: |
        node --version
        npm --version
    - name: Install dependencies
      run: npm ci
    - name: Run framework structure checks
      run: npm run check:framework
    - name: Run unit tests
      run: node --test
